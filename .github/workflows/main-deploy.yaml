name: Release Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    strategy:
        fail-fast: false
        matrix:
            python-version: ["3.12", "3.11", "3.10"]

    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${{ github.run_number }}-${{ github.sha }}" >> $GITHUB_ENV

      - name: Build the Docker image
        run: docker build -t ${{ secrets.username }}/devops-sre:${{ matrix.python-version }}-${IMAGE_TAG} .

      - name: Log in to Docker Hub
        run: echo ${{ secrets.password }} | docker login -u ${{ secrets.username }} --password-stdin

      - name: Push the Docker image
        run: docker push ${{ secrets.username }}/devops-sre:${{ matrix.python-version }}-${IMAGE_TAG}

      - name: Update Image Tag in Deployment Manifest
        run: sed -i "s|devops-sre:.*|devops-sre:3.12-${IMAGE_TAG}|g" manifests/Deployment-v3.12.yaml &&
                sed -i "s|devops-sre:.*|devops-sre:3.11-${IMAGE_TAG}|g" manifests/Deployment-v3.11.yaml &&
                sed -i "s|devops-sre:.*|devops-sre:3.10-${IMAGE_TAG}|g" manifests/Deployment-v3.10.yaml

      - name: Commit and push updated manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            git config  user.name "github-actions"
            git config  user.email "github-actions@github.com"
            git add manifests/Deployment-v3.12.yaml manifests/Deployment-v3.11.yaml manifests/Deployment-v3.10.yaml
            git diff-index --cached --quiet HEAD || git commit -m "Update image tag to ${{ matrix.python-version }}-${IMAGE_TAG}"
            git pull origin main --rebase
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com${{ github.repository }}.git main
