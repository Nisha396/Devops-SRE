apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-sre-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Nisha396/Devops-SRE.git
    targetRevision: main
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-sre-namespace

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true