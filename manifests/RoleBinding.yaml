apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-sre-role-binding
  namespace: devops-sre-namespace
  labels:
    app: devops-sre-app
  annotations:
    description: "This is a role binding for my DevOps SRE application"
subjects:
- kind: ServiceAccount
  name: devops-sre-service-account
  namespace: devops-sre-namespace
roleRef:
  kind: Role
  name: devops-sre-role
  apiGroup: rbac.authorization.k8s.io