apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-sre-deployment
  namespace: default
spec:
    replicas: 3
    selector:
        matchLabels:
        app: devops-sre-app
    template:
        metadata:
        labels:
            app: devops-sre-app
        spec:
          containers:
          - name: devops-sre-container
            image: nishabansal19/devops-sre:57-128f1f8cc6e040adeddabf0aee98cc857727c412
            ports:
            - containerPort: 8080