apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-sre-deployment
  namespace: default
spec:
    replicas: 3
    selector:
        matchLabels:
        app: devops-sre-app
    template:
        metadata:
        labels:
            app: devops-sre-app
        spec:
          containers:
          - name: devops-sre-container
            image: nishabansal19/devops-sre:1-f17668362217e76aeacee6c304056257f1682431
            ports:
            - containerPort: 8080