apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devops-sre-network-policy
  namespace: devops-sre-namespace
  labels:
    app: devops-sre-app
  annotations:
    description: "This is a network policy for my DevOps SRE application"
spec:
  podSelector:
    matchLabels:
      app: devops-sre-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: devops-sre-app