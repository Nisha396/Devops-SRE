apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-sre-role
  namespace: devops-sre-namespace
  labels:
    app: devops-sre-app
  annotations:
    description: "This is a role for my DevOps SRE application"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "watch", "list"]